<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resto du 04/07/2026</title>

<style>

:root{
    --beige:#f7f2ec;
    --taupe:#b9a99a;
    --taupe-dark:#8f7c6d;
    --text:#5d534b;
    --white:#fffdfb;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Segoe UI,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#f8f3ee,#ece3da);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:700px;
    background:var(--white);
    padding:40px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,0.08);
    text-align:center;
}

.hidden{
    display:none;
}

h1{
    color:var(--text);
    margin-bottom:20px;
}

p{
    color:var(--text);
    margin-bottom:20px;
    line-height:1.6;
}

input{
    width:100%;
    max-width:350px;
    padding:15px;
    border-radius:12px;
    border:2px solid #e2d8cf;
    font-size:16px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-top:20px;
}

button{
    border:none;
    border-radius:14px;
    padding:15px 25px;
    font-size:16px;
    cursor:pointer;
    transition:.25s;
}

.primary{
    background:var(--taupe);
    color:white;
}

.primary:hover{
    transform:translateY(-2px);
}

.secondary{
    background:#ebe1d7;
    color:var(--text);
}

#noButton{
    position:relative;
}

.summary{
    background:#f4ece4;
    padding:20px;
    border-radius:16px;
    margin-top:20px;
    text-align:left;
}

</style>
</head>

<body>

<div class="card">

    <div id="step1">

        <h1>🍝 Petit resto entre copains</h1>

        <p>
            Avant toute chose, comment t'appelles-tu ?
        </p>

        <input
            type="text"
            id="prenom"
            placeholder="Ton prénom">

        <div class="buttons">
            <button class="primary" onclick="startSurvey()">
                Continuer
            </button>
        </div>

    </div>

    <div id="step2" class="hidden">

        <h1>📅 04 juillet 2026</h1>

        <p>
            Es-tu présent(e) pour un resto le soir ?
        </p>

        <div class="buttons">

            <button
                class="primary"
                onclick="answerYes()">
                Oui 😎
            </button>

            <button
                id="noButton"
                class="secondary">
                Non 😬
            </button>

        </div>

    </div>

    <div id="step3" class="hidden">

        <h1>Excellente nouvelle 🎉</h1>

        <p>Tu viendras :</p>

        <div class="buttons">

            <button
                class="primary"
                onclick="chooseCompanion('Seul(e)')">
                Seul(e)
            </button>

            <button
                class="primary"
                onclick="chooseCompanion('Avec mon +1')">
                Avec mon +1
            </button>

        </div>

    </div>

    <div id="step4" class="hidden">

        <h1>Dernier détail 🚗</h1>

        <p>
            Pour trouver le meilleur resto possible...
        </p>

        <div class="buttons">

            <button
                class="primary"
                onclick="chooseLocation('Proche de Lille')">
                📍 Proche de Lille
            </button>

            <button
                class="primary"
                onclick="chooseLocation('30-40 min OK')">
                🚗 30 à 40 min de route OK
            </button>

        </div>

    </div>

    <div id="step5" class="hidden">

        <h1>❤️ Merci</h1>

        <div
            class="summary"
            id="summary">
        </div>

    </div>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyLxr-6MkG3NhhgvsbTaQm2QFLhQnlibQB9o-BBNujCivdvtCiMGcVjmn2MC8xjKKipoQ/exec";

let data = {
    prenom:"",
    presence:"",
    accompagnement:"",
    localisation:""
};

function show(step){

    document
        .querySelectorAll(".card > div")
        .forEach(div => div.classList.add("hidden"));

    document
        .getElementById(step)
        .classList.remove("hidden");
}

function startSurvey(){

    const prenom =
        document.getElementById("prenom")
        .value
        .trim();

    if(prenom === ""){
        alert("Indique ton prénom 😊");
        return;
    }

    data.prenom = prenom;

    show("step2");
}

function answerYes(){

    data.presence = "Oui";

    show("step3");
}

function chooseCompanion(choice){

    data.accompagnement = choice;

    show("step4");
}

async function chooseLocation(choice){

    data.localisation = choice;

    await sendData();

    document.getElementById("summary").innerHTML = `
        <strong>${data.prenom}</strong>,
        ta réponse a bien été enregistrée 🎉
        <br><br>
        Présence : ${data.presence}<br>
        Accompagnement : ${data.accompagnement}<br>
        Préférence : ${data.localisation}<br><br>
        Hâte de te voir le 04/07/2026 🍷
    `;

    show("step5");
}

async function answerNo(){

    data.presence = "Non";
    data.accompagnement = "-";
    data.localisation = "-";

    await sendData();

    document.getElementById("summary").innerHTML = `
        Merci pour ta réponse
        <strong>${data.prenom}</strong> ❤️
        <br><br>
        Tu vas nous manquer.
    `;

    show("step5");
}

async function sendData(){

    try{

        await fetch(
            SCRIPT_URL,
            {
                method:"POST",
                mode:"no-cors",
                body:JSON.stringify(data)
            }
        );

    }catch(error){

        console.error(error);
    }
}

const noButton =
    document.getElementById("noButton");

let escapeCount = 0;

function moveButton(){

    const x =
        Math.random()*250 - 125;

    const y =
        Math.random()*150 - 75;

    noButton.style.transform =
        `translate(${x}px,${y}px)`;
}

noButton.addEventListener("mouseenter",()=>{

    if(escapeCount >= 2) return;

    escapeCount++;

    moveButton();

    if(escapeCount === 1){
        noButton.textContent =
            "Tu es sûr(e) ? 🥺";
    }

    if(escapeCount === 2){
        noButton.textContent =
            "Tu vas me manquer ❤️";
        noButton.style.transform = "";
    }

});

noButton.addEventListener("click",()=>{

    if(escapeCount < 2){

        escapeCount++;

        moveButton();

        if(escapeCount === 1){
            noButton.textContent =
                "Tu es sûr(e) ? 🥺";
        }

        if(escapeCount === 2){
            noButton.textContent =
                "Tu vas me manquer ❤️";
            noButton.style.transform = "";
        }

        return;
    }

    answerNo();
});

</script>

</body>
</html>
